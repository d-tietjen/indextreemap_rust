[package]
name = "indextreemap"
version = "0.2.0"
edition = "2021"
description = "A BTreeMap-like ordered map with key and positional lookup."
categories = ["data-structures"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/d-tietjen/indextreemap_rust"
keywords = ["tree", "btree", "btreemap", "index", "indexing"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
xxhash-rust = { version = "0.8.12", features = ["xxh3"], optional = true }

[features]
default = ["serde"]
fast-hash = ["dep:xxhash-rust"]
serde = ["dep:serde"]

[dev-dependencies]
hex = "0.4.3"
criterion = "0.5.1"
rand = "0.8.5"
pprof = { version = "0.13.0", features = ["flamegraph", "criterion"] }
serde_json = "1.0.97"
sha2 = "0.10.8"
hex-literal = "0.4.1"

[[bench]]
name = "benches"
harness = false

[[bench]]
name = "harness"
harness = false

[[bench]]
name = "million"
harness = false
